[project]
name = "cgm-metric-library"
version = "2.0.0"
description = "Traceable CGM metrics, events, ATTD features, and impact audits"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "xlrd>=2.0.2",
]

[project.scripts]
cgm-library = "cgm_library.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgm_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
